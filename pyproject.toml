[project]
name = "rrsi"
version = "0.1.0"
description = "Regularized Recursive Self-Improvement of Agent Harnesses"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    # the search roles (proposer, analyst, critic) call Claude on Vertex AI
    "anthropic[vertex]>=0.40",
]

[project.optional-dependencies]
# The benchmark runners usually live in their own virtual environment (see
# RRSI_AGENT_PYTHON in the README); these extras list what they import.
agentic = [
    # archipelago runner (Harvey LAB, EngDesign) and the MCP gateways
    "fastmcp>=2.0",
    "litellm>=1.50",
    "loguru>=0.7",
    "mcp>=1.0",
    "openai>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.27",
    "tenacity>=8.0",
    "pymupdf>=1.24",
]
coding = [
    # Terminal-Bench 2.1 / SWE-bench Verified through harbor
    "harbor>=0.18",
]
dev = ["pytest>=7.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rrsi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
